type CategoryView {
  countryCode: String!
  description: String
  position: Int!
  slug: String!
  taskSlug: String!
  title: String!
}

type Country {
  """ISO 3166-1 alpha-2, lowercased, as it appears in a URL."""
  code: String!
  name: String!
}

"""One obligation, and what happens to it."""
type DiffEntry {
  differences: [FactDifference!]!
  from: ResolvedRule
  obligationSlug: String!

  """Why a person has to decide this one. Null when nobody does."""
  reason: String
  to: ResolvedRule
  verdict: Verdict!
}

type FactDifference {
  from: RuleFactValue
  key: String!
  to: RuleFactValue
}

type GuideObligationFact {
  currency: String
  key: String!
  numericValue: String
  operator: String!
  textValue: String
  unit: String
}

"""An obligation this guide explains, with its current facts."""
type GuideObligationView {
  facts: [GuideObligationFact!]!
  slug: String!
  title: String
}

type GuideSectionView {
  body: String
  kind: SectionKind!
  position: Int!
  steps: [GuideStepView!]!
  title: String
}

type GuideSourceView {
  name: String!
  url: String!
  verifiedAt: String!
}

type GuideStepView {
  body: String
  position: Int!
  title: String!
}

type GuideView {
  cost: String
  countryCode: String!
  description: String

  """
  The locale this content is actually in, which may not be the one asked for.
  """
  locale: String!
  obligations: [GuideObligationView!]!
  options: [String!]!
  quickAnswer: String
  sections: [GuideSectionView!]!
  showDisclaimer: Boolean!
  showSuggestUpdate: Boolean!
  slug: String!
  sources: [GuideSourceView!]!
  time: String
  title: String!

  """True when the requested language had no content and another was used."""
  translationMissing: Boolean!
  verifiedAt: String!
}

type Query {
  """The categories one country has, between a goal and a guide."""
  categories(country: String!, locale: String = "en-US"): [CategoryView!]!

  """What changed in one country between two dates, for this person."""
  changes(country: String!, nationality: String, since: String!, situation: String, until: String!): [DiffEntry!]!

  """Every country SkipBureau covers."""
  countries: [Country!]!

  """One country, or null where we do not cover it."""
  country(code: String!): Country

  """One guide, or null where we do not have it."""
  guide(country: String!, locale: String = "en-US", slug: String!): GuideView

  """Every guide in one country."""
  guides(country: String!, locale: String = "en-US"): [GuideView!]!

  """True when the API is answering. Nothing more is promised."""
  health: Boolean!

  """What changes for this person on moving between two countries."""
  move(at: String, from: String!, nationality: String, situation: String, to: String!): [DiffEntry!]!

  """The twelve goals. Global: the same intention in every country."""
  tasks(locale: String = "en-US"): [TaskView!]!
}

type ResolvedRule {
  facts: [RuleFactValue!]!
  obligationSlug: String!
  ruleVersionId: String!
}

type RuleFactValue {
  currency: String
  key: String!
  numericValue: String
  operator: String!
  textValue: String
  unit: String
}

"""The seven sections the design draws, in its order."""
enum SectionKind {
  commonProblems
  howToDoIt
  importantToKnow
  whatToCheck
  whatYouNeed
  whereToDoIt
  yourOptions
}

type TaskView {
  position: Int!
  slug: String!
  subtitle: String
  title: String!
}

"""
What happens to one obligation when this person moves, or when time passes.
"""
enum Verdict {
  changed
  endsOnLeaving
  identical
  needsReview
  newInDestination
}