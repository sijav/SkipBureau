name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 24, matching the machine everything here was verified on. `engines`
          # says >=22.12.0, which is a claim this workflow does not test; that
          # is a deliberate choice, not an oversight. See the plan beside this
          # file.
          node-version: 24
          cache: npm

      - run: npm ci

      # `postinstall` in apps/web installs the Chromium BINARY. This adds the
      # system libraries it needs, which the binary does not carry and an
      # ubuntu-latest image does not promise to keep. No xvfb: the Storybook
      # vitest project is headless, and xvfb is for headed Linux runs.
      - name: Chromium system libraries
        run: npx playwright install-deps chromium

      # The generated Prisma client is NOT committed, and everything below
      # reaches it: the SDL emitter imports the resolvers, which reach
      # PrismaService, which imports the client. It needs no database, because
      # prisma.config.ts defaults the url to an empty string.
      - name: Generate the Prisma client
        run: npm run db:generate -w @skipbureau/api

      # The SDL, emitted from the Nest resolvers, then codegen over it. The web
      # app's types come from here, so this runs before anything typechecks.
      - name: The GraphQL contract
        run: npm run contract -w @skipbureau/web

      - name: Lint the web app
        run: npm run lint -w @skipbureau/web

      - name: Lint the API
        run: npm run lint -w @skipbureau/api

      - name: Typecheck the web app
        run: npm run typecheck -w @skipbureau/web

      - name: Typecheck the API
        run: npm run lint:tsc -w @skipbureau/api

      # `test:coverage` rather than `test`: it runs BOTH vitest projects, unit
      # and Storybook, and prints the coverage number. There is deliberately no
      # threshold. A number nobody agreed is a gate nobody asked for, and one
      # set at today's figure fails on the next unrelated uncovered line, which
      # teaches people to raise it rather than write the test. SB-112 is where
      # that decision belongs.
      - name: Web tests, and the coverage number
        run: npm run test:coverage -w @skipbureau/web

      # No database service. These start PGlite, Postgres compiled to
      # WebAssembly, in process, and apply the committed migrations to it.
      - name: API tests, against a real Postgres
        run: npm test -w @skipbureau/api

      - name: Build the web app
        run: npm run build -w @skipbureau/web

      - name: Build the API
        run: npm run build -w @skipbureau/api

  # History, not the working tree. A secret added in one commit and deleted in
  # the next is absent from the tree and still in the object database, which is
  # exactly the case a working-tree scan reports clean.
  #
  # This runs AFTER GitHub has accepted the push, so it is a backstop rather
  # than a pre-publication gate: push protection is the pre-push control. What
  # this adds is coverage of what push protection's partner patterns miss, and
  # a red branch before anything is merged, released or deployed.
  secrets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # The default is ONE commit. A history scanner pointed at a shallow
          # clone reports clean, quickly and confidently, which is the worst
          # failure available to this job.
          fetch-depth: 0

      - name: Install gitleaks, checksum verified
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o "$archive" "$base/$archive"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          # A pinned version with an unverified binary is a pinned version
          # number and an unpinned binary.
          grep " $archive\$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm -f "$archive" checksums.txt
          gitleaks version

      - name: Prove the scanner still detects anything at all
        run: |
          set -euo pipefail
          # There is an open report that this version can exit 0 on real
          # matches. A scanner that has silently stopped detecting reports
          # CLEAN, which is the precise failure this job exists to prevent, so
          # its clean answer means nothing until it has found something planted.
          #
          # The token is generated here rather than written down, so this file
          # contains no secret-shaped string for push protection to object to.
          probe="$(mktemp -d)"
          git -c core.fsmonitor=false init -q "$probe"
          printf 'token = "ghp_%s"\n' "$(head -c 200 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 36)" > "$probe/planted.txt"
          git -C "$probe" add -A
          git -C "$probe" -c user.email=ci@skipbureau.invalid -c user.name=CI commit -qm planted
          if gitleaks git --redact --exit-code 1 --log-opts=--all "$probe"; then
            echo "::error::gitleaks found nothing in a file that is nothing but a credential. Its clean answer cannot be trusted."
            exit 1
          fi
          echo "the scanner detects a planted credential, so a clean answer means something"

      - name: Scan every object reachable from every ref
        run: gitleaks git --redact --exit-code 1 --log-opts=--all .
